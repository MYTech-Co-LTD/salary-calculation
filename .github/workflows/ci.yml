name: Test & Deploy

# ═══════════════════════════════════════════════════════════════
# 迁移到 openship 后(2026-08-07):
#   - test  : 美国 runner,PR 门禁(pytest + 前端构建)
#   - deploy: main push 且 test 通过后 → 触发 openship 部署
#     (POST /api/deployments,带 OPENSHIP_TOKEN,commitSha=github.sha)
# 构建/部署由 openship 在生产机完成(lesson.hookflow.cn)。
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ───────── 测试(GitHub 美国 runner,网络无限制)─────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e ".[dev,web]"
      - run: pytest -q

      # 前端类型检查 + 构建(H4:防前端类型错误/构建失败悄悄合 main)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (tsc + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ───────── 部署:test 通过 + main push → 触发 openship ─────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 并行 agent 同时合并 → 部署排队，不互相抢（详见 docs/architecture/ci.md）
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Trigger openship deploy
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
          # 控制面地址必须带 /api/proxy 前缀：裸 /api/* 会被 edge 路由给 dashboard 壳，回 403/404。
          # 做成变量是为了换环境不改工作流；缺省即公司控制面。
          OPENSHIP_URL: ${{ vars.OPENSHIP_URL || 'https://deploy.hookflow.cn/api/proxy' }}
          PROJECT_ID: proj_gQCXaFXxQ8K5UVGd
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "openship: project=${PROJECT_ID} commit=${COMMIT_SHA}"
          # commitSha 是幂等键：同一个 sha 重复触发不会部署出两份。
          # 同项目同一时刻只允许一个部署：并发时 API 回 "already in progress"，等待重试即可，
          # 不要当失败（curl 不用 -f：-f 会丢掉 body，无法区分「互斥等待」与「真失败」）。
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /tmp/openship-deploy.json -w '%{http_code}' -X POST "${OPENSHIP_URL%/}/api/deployments" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"projectId\":\"${PROJECT_ID}\",\"branch\":\"main\",\"commitSha\":\"${COMMIT_SHA}\",\"environment\":\"production\"}")
            if [ "${CODE:0:1}" = "2" ]; then
              echo "部署触发成功（HTTP ${CODE}）："
              cat /tmp/openship-deploy.json
              exit 0
            fi
            BODY=$(cat /tmp/openship-deploy.json 2>/dev/null || true)
            echo "第 ${i}/10 次触发：HTTP ${CODE} ${BODY:0:200}"
            if ! grep -q 'already in progress' /tmp/openship-deploy.json 2>/dev/null; then
              echo "::error::部署触发失败（非互斥错误，不重试）"
              exit 1
            fi
            echo "既有部署在跑，30s 后重试"
            sleep 30
          done
          echo "::error::等待既有部署完成超时（约 5 分钟）——去控制面看卡住的部署"
          exit 1
